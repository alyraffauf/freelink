name: ci

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix develop -c cargo fmt --check
      - run: nix develop -c cargo clippy --locked --all-targets -- -D warnings
      - run: nix develop -c cargo test --locked
      - run: nix develop -c cargo test --locked --no-default-features
      - run: nix flake check -L --no-update-lock-file
      - run: nix flake check --all-systems --no-build --no-update-lock-file
      - run: nix build -L --no-link --no-update-lock-file .#freepilot
